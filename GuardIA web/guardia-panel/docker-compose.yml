services:
  postgres:
    image: postgres:16-alpine
    container_name: guardia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: guardia
      POSTGRES_USER: guardia_app
      POSTGRES_PASSWORD: guardia_dev
    ports:
      - "5433:5432"
    volumes:
      - postgres_guardia_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro

volumes:
  postgres_guardia_data:
